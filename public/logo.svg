<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 140" width="100%" height="100%">
  <!-- Container with subtle border -->
  <rect x="2" y="2" width="396" height="136" rx="6" ry="6" fill="#FFFFFF" stroke="#08502A" stroke-width="3"/>
  
  <!-- Top Split Header -->
  <!-- Left Side: Dark Forest Green box for ENERGY -->
  <rect x="3" y="3" width="240" height="90" rx="4" ry="4" fill="#08502A"/>
  <!-- Square off bottom corners of top box -->
  <rect x="3" y="80" width="240" height="15" fill="#08502A"/>
  <rect x="230" y="3" width="13" height="90" fill="#08502A"/>
  
  <!-- Right Side: Vibrant Solar Yellow box for MAN -->
  <rect x="243" y="3" width="154" height="90" rx="4" ry="4" fill="#FDE047"/>
  <!-- Square off bottom corners of top box -->
  <rect x="243" y="80" width="154" height="15" fill="#FDE047"/>
  <rect x="243" y="3" width="13" height="90" fill="#FDE047"/>
  
  <!-- Divider between ENERGY and MAN -->
  <line x1="243" y1="3" x2="243" y2="93" stroke="#08502A" stroke-width="2"/>
  
  <!-- Text: ENERGY (Bright Yellow) -->
  <text x="122" y="68" font-family="'Plus Jakarta Sans', 'Inter', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#FDE047" text-anchor="middle" letter-spacing="1">ENERGY</text>
  
  <!-- Text: MAN (Dark Forest Green) -->
  <text x="320" y="68" font-family="'Plus Jakarta Sans', 'Inter', 'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#08502A" text-anchor="middle" letter-spacing="1">MAN</text>
  
  <!-- Horizontal Divider -->
  <line x1="2" y1="93" x2="398" y2="93" stroke="#08502A" stroke-width="2.5"/>
  
  <!-- Subtitle Text: Renewable Energy Saves Earth (Forest Green) -->
  <text x="200" y="122" font-family="'Plus Jakarta Sans', 'Inter', sans-serif" font-size="21" font-weight="700" fill="#08502A" text-anchor="middle" letter-spacing="1.2">Renewable Energy Saves Earth</text>
</svg>
